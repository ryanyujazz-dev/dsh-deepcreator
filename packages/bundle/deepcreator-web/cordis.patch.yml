# DeepCreator presentation layer over @deepseek-ai/dsh-web-app. The official
# Host, transport, Client Runtime, Slot renderer, and unchanged feature rows
# remain mounted. Each replaced official UI owner is disabled before the
# DeepCreator implementation is inserted under a distinct id.

- id: locale
  disabled: true
- id: ui-theme
  disabled: true
- id: ui-brand-official
  disabled: true
- id: ui-layout
  disabled: true
- id: ui-sidebar
  disabled: true
- id: ui-settings-general
  disabled: true
- id: ui-conversation
  disabled: true
- id: ui-tool
  disabled: true
- id: ui-trajectory
  disabled: true
- id: ui-workspace
  disabled: true
- id: ui-agent-preset
  disabled: true
- id: ui-model-selection
  disabled: true
- id: ui-permission
  disabled: true
- id: ui-subagent
  disabled: true
- id: ui-user-questions
  disabled: true
- id: ui-jobs
  disabled: true

