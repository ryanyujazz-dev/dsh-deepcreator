# ExecFlow chat override bundle: disables the stock conversation/tool UI rows
# and inserts the ExecFlow-modified packages in their place. Slot keys are
# unchanged (official keys), so every other plugin (feedback, deliverables,
# trajectory, model selection, ...) keeps working against the replaced seats.
#
# Applied as a profile bundle layer over dsh-base + dsh-web-app; the stock
# rows above keep their config, and later layers still win per id.
- id: ui-conversation
  disabled: true

- id: ui-tool
  disabled: true

- insert:
    # Same plugin code as the stock rows, under this bundle's package names.
    # Ids differ from the disabled rows (a patch replaces a row's config,
    # not its package name), which is why the disable + insert pair is the
    # swap mechanism.
    - id: execflow-conversation
      name: '@ryanyujazz/dsh-client-ui-conversation'

    - id: execflow-tool
      name: '@ryanyujazz/dsh-client-ui-tool'
