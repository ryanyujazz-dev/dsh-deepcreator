<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>看板演示</title>
<style>
  body{font-family:system-ui;margin:0;display:grid;place-items:center;height:100vh;background:#f5f5f7;color:#1d1d1f}
  main{text-align:center;width:min(420px,90vw)}
  h1{font-size:22px;margin:0 0 4px}
  p.meta{color:#6e6e73;font-size:13px;margin:0 0 16px}
  ul{list-style:none;padding:0;margin:0 0 14px;text-align:left}
  li{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#fff;border-radius:8px;margin-bottom:6px;font-size:14px}
  li button{border:none;background:none;color:#0071e3;cursor:pointer;font-size:13px}
  form{display:flex;gap:8px}
  input{flex:1;padding:8px 12px;border:1px solid #d2d2d7;border-radius:8px;font-size:14px}
  button.add{border:none;background:#0071e3;color:#fff;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer}
  .rev{font-size:11px;color:#86868b}
</style></head>
<body>
<main>
  <h1>📋 看板演示</h1>
  <p class="meta">App Stage 数据桥演示 · 状态存 AppData（journal 持久）</p>
  <ul id="list"></ul>
  <form id="form"><input id="title" placeholder="新卡片标题…" autocomplete="off"><button class="add" type="submit">添加</button></form>
  <p class="rev" id="rev"></p>
</main>
<script src="app.js"></script>
</body>
</html>
