<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>DeepCreator · 极简 Skill 设置原型</title>
  <style>
    :root {
      color-scheme: light;
      --base: #ffffff;
      --sidebar: #f7f8fa;
      --layer: #ffffff;
      --layer-soft: #f6f7f9;
      --layer-hover: #f0f2f5;
      --layer-active: #e9edf2;
      --text: #17191d;
      --text-2: #626872;
      --text-3: #949aa4;
      --border: #e5e7eb;
      --border-strong: #d6d9df;
      --brand: #4176e6;
      --brand-hover: #3569d5;
      --brand-soft: #edf3ff;
      --danger: #d83b3b;
      --danger-soft: #fff1f1;
      --warning: #b86b00;
      --warning-soft: #fff7e8;
      --mask: rgba(23, 25, 29, .22);
      --shadow: 0 24px 72px rgba(20, 24, 31, .18);
      --font-ui: "SF Pro Text", "Segoe UI", sans-serif;
      --font-code: "SFMono-Regular", "Cascadia Mono", monospace;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--base);
      color: var(--text);
      font: 400 14px/22px var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    svg { display: block; }
    [hidden] { display: none !important; }

    .icon {
      width: 16px;
      height: 16px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-14 { width: 14px; height: 14px; }
    .icon-18 { width: 18px; height: 18px; }

    .app {
      display: grid;
      grid-template-columns: 252px minmax(0, 1fr);
      width: 100%;
      height: 100%;
      min-width: 720px;
    }

    .app-sidebar {
      display: flex;
      min-width: 0;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--sidebar);
    }
    .brand-row {
      display: flex;
      height: 48px;
      flex: none;
      align-items: center;
      padding: 0 14px;
    }
    .traffic { display: flex; gap: 8px; }
    .traffic i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
    .traffic i:nth-child(1) { background: #ff5f57; }
    .traffic i:nth-child(2) { background: #febc2e; }
    .traffic i:nth-child(3) { background: #28c840; }
    .brand { display: flex; align-items: center; gap: 7px; margin-left: 10px; font-weight: 600; }
    .brand-mark { width: 16px; height: 16px; color: var(--text); }

    .sidebar-body { min-height: 0; flex: 1; overflow-y: auto; padding: 0 7px; }
    .nav-stack { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
    .sidebar-row {
      display: flex;
      width: 100%;
      height: 32px;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      color: var(--text);
      text-align: left;
    }
    .sidebar-row:hover { background: var(--layer-hover); }
    .sidebar-row:focus-visible, .settings-nav-button:focus-visible, .button:focus-visible,
    .icon-button:focus-visible, .skill-main:focus-visible, .switch:focus-visible,
    .choice:focus-visible, .menu-item:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: -2px;
    }
    .sidebar-label { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-section { margin-top: 10px; padding: 0 8px; color: var(--text-3); font-size: 12px; line-height: 26px; }
    .session-row { height: 30px; padding-left: 32px; color: var(--text-2); font-size: 13px; }
    .sidebar-foot { flex: none; padding: 7px; }

    .conversation {
      display: flex;
      min-width: 0;
      flex-direction: column;
      background: var(--base);
    }
    .conversation-header {
      display: flex;
      height: 48px;
      flex: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
    }
    .conversation-header strong { font-size: 14px; font-weight: 500; }
    .header-actions { display: flex; align-items: center; gap: 4px; }
    .conversation-body {
      width: min(748px, calc(100% - 48px));
      margin: 0 auto;
      padding: 76px 0;
      color: var(--text-2);
    }
    .conversation-body h1 { margin: 0 0 16px; color: var(--text); font-size: 28px; line-height: 36px; font-weight: 500; letter-spacing: -.6px; }
    .conversation-body p { max-width: 560px; margin: 0; }
    .prompt-shell {
      display: flex;
      min-height: 68px;
      align-items: flex-end;
      gap: 12px;
      margin-top: 54px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--layer);
      box-shadow: 0 8px 28px rgba(30, 36, 44, .06);
    }
    .prompt-shell span { flex: 1; color: var(--text-3); }

    .icon-button, .button {
      display: inline-flex;
      height: 32px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 11px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
    }
    .icon-button { width: 32px; padding: 0; }
    .icon-button:hover, .button:hover { background: var(--layer-hover); }
    .button.primary { background: var(--brand); color: #fff; }
    .button.primary:hover { background: var(--brand-hover); }
    .button.danger { background: var(--danger-soft); color: var(--danger); }
    .button:disabled { cursor: default; opacity: .46; }

    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
    }
    .settings-mask { position: absolute; inset: 0; background: var(--mask); backdrop-filter: blur(3px); }
    .settings-panel {
      position: relative;
      z-index: 1;
      display: flex;
      width: 800px;
      height: min(760px, calc(100vh - 48px));
      max-width: calc(100vw - 48px);
      overflow: hidden;
      border-radius: 24px;
      background: var(--layer);
      box-shadow: var(--shadow);
    }
    .settings-nav {
      display: flex;
      width: 188px;
      flex: none;
      flex-direction: column;
      gap: 18px;
      padding: 22px 12px 0;
    }
    .settings-title { padding: 0 12px; font-size: 14px; line-height: 22px; font-weight: 500; }
    .settings-nav-list { display: flex; flex-direction: column; gap: 4px; }
    .settings-nav-button {
      display: flex;
      width: 100%;
      height: 40px;
      align-items: center;
      gap: 8px;
      padding: 0 16px 0 12px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
      color: var(--text);
      font-size: 12px;
      line-height: 18px;
      text-align: left;
    }
    .settings-nav-button:hover { background: var(--layer-hover); }
    .settings-nav-button.active { background: var(--layer-active); }
    .settings-nav-button span { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .settings-content { display: flex; min-width: 0; flex: 1; flex-direction: column; }
    .settings-header {
      display: flex;
      height: 54px;
      flex: none;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 20px 14px 8px 10px;
    }
    .settings-close { width: 28px; height: 28px; border-radius: 50%; }
    .settings-options { min-height: 0; flex: 1; overflow-y: auto; padding: 0 24px 24px; }

    .page { width: 100%; animation: page-in .16s ease-out; }
    @keyframes page-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    .page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin: 0 0 22px; }
    .page-heading-copy { min-width: 0; }
    .page-heading h1 { margin: 0; font-size: 18px; line-height: 26px; font-weight: 500; letter-spacing: -.2px; }
    .page-heading p { margin: 4px 0 0; color: var(--text-2); font-size: 12px; line-height: 18px; }
    .page-actions { display: flex; align-items: center; gap: 8px; }
    .search {
      position: relative;
      width: 186px;
    }
    .search svg { position: absolute; top: 8px; left: 10px; color: var(--text-3); pointer-events: none; }
    .search input {
      width: 100%;
      height: 32px;
      padding: 0 10px 0 32px;
      border: 1px solid transparent;
      border-radius: 8px;
      outline: 0;
      background: var(--layer-soft);
      color: var(--text);
      font-size: 12px;
    }
    .search input:focus { border-color: var(--brand); background: var(--layer); }
    .search input::placeholder { color: var(--text-3); }

    .skill-list { display: grid; gap: 10px; }
    .skill-card {
      display: grid;
      min-height: 74px;
      grid-template-columns: minmax(0, 1fr) auto;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--layer);
      transition: border-color .14s ease, background .14s ease;
    }
    .skill-card:hover { border-color: var(--border-strong); background: #fdfdfd; }
    .skill-card.disabled .skill-glyph { color: var(--text-3); background: var(--layer-soft); }
    .skill-main {
      display: grid;
      min-width: 0;
      grid-template-columns: 36px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      padding: 11px 8px 11px 12px;
      border: 0;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .skill-glyph {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 10px;
      background: var(--brand-soft);
      color: var(--brand);
    }
    .skill-copy { min-width: 0; }
    .skill-title-line { display: flex; min-width: 0; align-items: center; gap: 7px; }
    .skill-name { min-width: 0; overflow: hidden; font-size: 13px; line-height: 19px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
    .skill-state { flex: none; color: var(--text-3); font-size: 10px; line-height: 16px; }
    .skill-state.problem { color: var(--warning); }
    .skill-description { display: block; overflow: hidden; margin-top: 1px; color: var(--text-2); font-size: 11px; line-height: 17px; text-overflow: ellipsis; white-space: nowrap; }
    .skill-source { display: block; color: var(--text-3); font-size: 10px; line-height: 16px; }
    .switch-cell { display: grid; width: 66px; place-items: center; }
    .switch {
      position: relative;
      width: 34px;
      height: 20px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: #c8ccd3;
      cursor: pointer;
      transition: background .16s ease;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(15, 18, 24, .22);
      transition: transform .16s ease;
    }
    .switch[aria-checked="true"] { background: var(--brand); }
    .switch[aria-checked="true"]::after { transform: translateX(14px); }
    .empty { padding: 70px 20px; color: var(--text-3); text-align: center; }
    .empty strong { display: block; margin-bottom: 4px; color: var(--text-2); font-weight: 500; }

    .back {
      display: inline-flex;
      height: 28px;
      align-items: center;
      gap: 5px;
      margin: -3px 0 18px -7px;
      padding: 0 7px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
      color: var(--text-2);
      font-size: 12px;
    }
    .back:hover { background: var(--layer-hover); color: var(--text); }
    .detail-head { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: start; gap: 13px; padding-bottom: 22px; }
    .detail-icon { display: grid; width: 44px; height: 44px; place-items: center; border-radius: 12px; background: var(--brand-soft); color: var(--brand); }
    .detail-title { min-width: 0; }
    .detail-title h1 { margin: 0; overflow-wrap: anywhere; font-size: 18px; line-height: 25px; font-weight: 500; letter-spacing: -.2px; }
    .detail-title p { margin: 4px 0 0; color: var(--text-2); font-size: 12px; line-height: 18px; }
    .detail-actions { position: relative; display: flex; align-items: center; gap: 8px; padding-top: 6px; }
    .facts { margin: 0; border-top: 1px solid var(--border); }
    .fact { display: grid; min-height: 46px; grid-template-columns: 92px minmax(0, 1fr); align-items: center; border-bottom: 1px solid var(--border); font-size: 12px; }
    .fact dt { color: var(--text-3); }
    .fact dd { min-width: 0; margin: 0; color: var(--text-2); }
    .fact code { font: 400 11px/18px var(--font-code); overflow-wrap: anywhere; }
    .link-button { padding: 0; border: 0; background: transparent; cursor: pointer; color: var(--brand); font-size: 12px; }
    .link-button:hover { text-decoration: underline; text-underline-offset: 3px; }
    .detail-section { padding-top: 24px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .section-heading h2 { margin: 0; font-size: 12px; line-height: 18px; font-weight: 500; }
    .instruction {
      padding: 15px 16px;
      border-radius: 12px;
      background: var(--layer-soft);
      color: var(--text-2);
      font-size: 12px;
      line-height: 20px;
    }
    .instruction h3 { margin: 0 0 8px; color: var(--text); font-size: 13px; line-height: 20px; font-weight: 500; }
    .instruction p { margin: 0 0 8px; }
    .instruction p:last-child { margin-bottom: 0; }
    .resource-row {
      display: flex;
      width: 100%;
      min-height: 44px;
      align-items: center;
      gap: 9px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      color: var(--text-2);
      text-align: left;
    }
    .resource-row:hover { background: var(--layer-hover); }
    .resource-row span { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .resource-row small { color: var(--text-3); }

    .context-menu {
      position: absolute;
      top: 42px;
      right: 0;
      z-index: 20;
      width: 184px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--layer);
      box-shadow: 0 12px 34px rgba(20, 24, 31, .14);
    }
    .menu-item {
      display: flex;
      width: 100%;
      height: 34px;
      align-items: center;
      gap: 8px;
      padding: 0 9px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
      color: var(--text-2);
      font-size: 12px;
      text-align: left;
    }
    .menu-item:hover { background: var(--layer-hover); color: var(--text); }
    .menu-item.danger { color: var(--danger); }
    .menu-separator { height: 1px; margin: 4px 7px; background: var(--border); }

    .placeholder-card, .plugin-card {
      padding: 15px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--layer);
    }
    .placeholder-card + .placeholder-card, .plugin-card + .plugin-card { margin-top: 10px; }
    .placeholder-card strong, .plugin-card strong { display: block; font-size: 13px; line-height: 20px; font-weight: 500; }
    .placeholder-card p, .plugin-card p { margin: 4px 0 0; color: var(--text-2); font-size: 11px; line-height: 18px; }
    .plugin-card.highlight { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
    .plugin-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; color: var(--text-3); font-size: 10px; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1100;
      display: grid;
      place-items: center;
      background: rgba(23, 25, 29, .26);
      backdrop-filter: blur(2px);
    }
    .modal {
      width: min(440px, calc(100vw - 40px));
      overflow: hidden;
      border-radius: 16px;
      background: var(--layer);
      box-shadow: var(--shadow);
    }
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 18px 12px; }
    .modal-header h2 { margin: 0; font-size: 16px; line-height: 23px; font-weight: 500; }
    .modal-header p { margin: 2px 0 0; color: var(--text-2); font-size: 11px; line-height: 17px; }
    .modal-body { padding: 4px 18px 18px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); }
    .choice-list { display: grid; gap: 8px; }
    .choice {
      display: grid;
      min-height: 58px;
      grid-template-columns: 34px minmax(0, 1fr) 16px;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .choice:hover { border-color: var(--border-strong); background: var(--layer-soft); }
    .choice-icon { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 9px; background: var(--layer-soft); color: var(--text-2); }
    .choice strong { display: block; font-size: 12px; line-height: 18px; font-weight: 500; }
    .choice small { display: block; color: var(--text-3); font-size: 10px; line-height: 16px; }
    .field-label { display: block; margin-bottom: 6px; color: var(--text-2); font-size: 11px; }
    .field {
      width: 100%;
      height: 36px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: 0;
      color: var(--text);
      background: var(--layer);
      font-size: 12px;
    }
    .field:focus { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
    .scope { display: flex; gap: 4px; margin-top: 14px; padding: 3px; border-radius: 9px; background: var(--layer-soft); }
    .scope button { height: 28px; flex: 1; border: 0; border-radius: 7px; background: transparent; cursor: pointer; color: var(--text-2); font-size: 11px; }
    .scope button.active { background: var(--layer); color: var(--text); box-shadow: 0 1px 3px rgba(20,24,31,.08); }
    .drop-zone { display: grid; min-height: 108px; place-items: center; padding: 18px; border: 1px dashed var(--border-strong); border-radius: 10px; color: var(--text-2); text-align: center; }
    .drop-zone strong { display: block; margin-top: 8px; font-size: 12px; font-weight: 500; }
    .drop-zone small { display: block; color: var(--text-3); font-size: 10px; }
    .confirm-path { margin-top: 10px; padding: 9px 10px; border-radius: 8px; background: var(--layer-soft); color: var(--text-2); font: 400 11px/18px var(--font-code); overflow-wrap: anywhere; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 1200;
      padding: 8px 12px;
      border-radius: 9px;
      background: #24272d;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity .16s ease, transform .16s ease;
      font-size: 11px;
      line-height: 18px;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 780px) {
      .app { grid-template-columns: 220px minmax(0, 1fr); }
      .settings-panel { max-width: calc(100vw - 24px); height: calc(100vh - 24px); }
      .settings-nav { width: 164px; padding-left: 8px; padding-right: 8px; }
      .settings-options { padding-right: 18px; padding-left: 18px; }
      .search { width: 150px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

    <symbol id="i-folder" viewBox="0 0 16 16"><path d="M1.8 4.3h4l1.1 1.3h7.3v6.6a1 1 0 0 1-1 1H2.8a1 1 0 0 1-1-1V4.3Z"/><path d="M1.8 5.6V3.8a1 1 0 0 1 1-1H6l1.2 1.5h6a1 1 0 0 1 1 1v.3"/></symbol>

      </header>
      <div class="conversation-body">
        <h1>让能力保持可见，也保持克制。</h1>
        <p>Skill 管理被收进设置页。主界面的“技能”只负责带你到那里，不再占用单独的工作区域。</p>

  <div class="settings-overlay" id="settingsOverlay" hidden>
    <div class="settings-mask" id="settingsMask"></div>
    <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsDialogTitle">

          <button class="settings-nav-button" data-section="models"><svg class="icon"><use href="#i-database"/></svg><span>模型</span></button>
          <button class="settings-nav-button" data-section="plugins"><svg class="icon"><use href="#i-package"/></svg><span>插件</span></button>
          <button class="settings-nav-button" data-section="skills"><svg class="icon"><use href="#i-skill"/></svg><span>技能</span></button>
        </div>
      </nav>
      <div class="settings-content">
        <header class="settings-header">
          <button class="icon-button settings-close" id="settingsClose" aria-label="关闭设置"><svg class="icon icon-14"><use href="#i-close"/></svg></button>
        </header>
        <div class="settings-options" id="settingsContent"></div>
      </div>
    </section>
  </div>

  <div id="modalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const initialSkills = [
      {
        id: 'browser-control', name: 'browser-control',
        description: '通过语义动作控制浏览器并完成可验证的页面操作。',
        sourceType: 'plugin', sourceLabel: '插件 · browser-tools', enabled: true,
        provider: 'browser-tools', path: 'browser-tools/skills/browser-control', status: 'active',
        instructions: '使用浏览器能力前先确认目标页面与成功条件。通过语义定位完成操作，并在关键步骤后读取页面状态进行验证。',
        files: ['SKILL.md', 'references/actions.md', 'references/verification.md'],
      },
      {
        id: 'deepcreator-cordis-development', name: 'deepcreator-cordis-development',
        description: '开发、重构并验证 DeepCreator 的 Cordis 插件。',
        sourceType: 'project', sourceLabel: '当前项目', enabled: true,
        provider: 'filesystem', path: '.agents/skills/deepcreator-cordis-development', status: 'active',
        instructions: '保持官方 Runtime 权威，DeepCreator 行为作为可插入、可禁用、可释放的 Cordis 插件贡献。修改后按受影响范围完成验证。',
        files: ['SKILL.md', 'references/repository-map.md'],
      },
      {
        id: 'ui-design', name: 'ui-design',
        description: '在实现前确定界面层级、视觉方向与交互规格。',
        sourceType: 'personal', sourceLabel: '个人', enabled: true,
        provider: 'filesystem', path: '~/.agents/skills/ui-design', status: 'active',
        instructions: '先明确界面的目的、视觉方向、颜色、字体和布局策略，再进入实现；完成后检查颜色、图标、排版和交互一致性。',
        files: ['SKILL.md', 'checklist.md'],
      },
      {
        id: 'knowledge-curator', name: 'knowledge-curator',
        description: '整理个人知识库中的主题、来源和交叉链接。',
        sourceType: 'personal', sourceLabel: '个人', enabled: true,
        provider: 'filesystem', path: '~/.agents/skills/knowledge-curator', status: 'problem',
        instructions: '读取知识库索引，建立主题之间的关系，并在输出中保留可追溯的来源。',
        files: ['SKILL.md', 'references/schema.md'],
      },
      {
        id: 'record-browser-gif', name: 'record-browser-gif',
        description: '录制浏览器演示并生成经过优化的 GIF。',
        sourceType: 'bundled', sourceLabel: 'Bundled', enabled: true,
        provider: 'deepcreator-skills', path: 'assets/skills/record-browser-gif', status: 'active',
        instructions: '先规划录制范围和关键操作，再生成短而清晰的演示，并检查输出尺寸与播放节奏。',
        files: ['SKILL.md', 'scripts/record.sh'],
      },
      {
        id: 'research-notes', name: 'research-notes',
        description: '在研究笔记中搜索、交叉引用并生成带出处的摘要。',
        sourceType: 'linked', sourceLabel: '外部链接', enabled: false,
        provider: 'filesystem-link', path: '~/Documents/Research/skills/research-notes', status: 'disabled',
        instructions: '从研究笔记中选择可信来源，交叉核对关键结论，并将引用放在对应陈述附近。',
        files: ['SKILL.md', 'references/sources.md'],
      },
    ]

    let skills = initialSkills.map(skill => ({ ...skill, files: [...skill.files] }))
    let searchQuery = ''
    let menuOpen = false
    let toastTimer
    let addScope = 'personal'

    const overlay = document.querySelector('#settingsOverlay')
    const content = document.querySelector('#settingsContent')
    const nav = document.querySelector('#settingsNav')
    const modalRoot = document.querySelector('#modalRoot')
    const toast = document.querySelector('#toast')

    const icon = (name, extra = '') => `<svg class="icon ${extra}" aria-hidden="true"><use href="#i-${name}"/></svg>`
    const escapeHtml = value => String(value).replace(/[&<>"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[char])

    function parseRoute() {
      const raw = location.hash.replace(/^#\/?/, '')
      if (!raw || raw === 'home') return { open: false, section: 'general' }
      const parts = raw.split('/').filter(Boolean)
      if (parts[0] !== 'settings') return { open: false, section: 'general' }
      return { open: true, section: parts[1] || 'general', id: parts.slice(2).join('/') || undefined }
    }

    function navigate(path) {
      const next = `#${path}`
      if (location.hash === next) render()
      else location.hash = next
    }

    function showToast(message) {
      clearTimeout(toastTimer)
      toast.textContent = message
      toast.classList.add('show')
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2600)
    }

    function activeCount() {
      return skills.filter(skill => skill.enabled).length
    }

    function render() {
      const route = parseRoute()
      overlay.hidden = !route.open
      if (!route.open) return
      nav.querySelectorAll('[data-section]').forEach(button => {
        button.classList.toggle('active', button.dataset.section === route.section)
        if (button.dataset.section === route.section) button.setAttribute('aria-current', 'page')
        else button.removeAttribute('aria-current')
      })
      menuOpen = false
      if (route.section === 'skills') {
        if (route.id) renderSkillDetail(route.id)
        else renderSkillList()
      } else if (route.section === 'plugins') {
        renderPlugins(route.id)
      } else {
        renderPlaceholder(route.section)
      }
    }

    function renderSkillList() {
      const query = searchQuery.trim().toLowerCase()
      const visible = skills.filter(skill => [skill.name, skill.description, skill.sourceLabel].some(value => value.toLowerCase().includes(query)))
      content.innerHTML = `
        <section class="page" aria-labelledby="skillsTitle">
          <div class="page-heading">
            <div class="page-heading-copy">
              <h1 id="skillsTitle">Skills</h1>
              <p>${skills.length} 个技能 · ${activeCount()} 个已开启</p>
            </div>
            <div class="page-actions">
              <label class="search">
                ${icon('search', 'icon-14')}
                <input id="skillSearch" type="search" value="${escapeHtml(searchQuery)}" placeholder="搜索技能" aria-label="搜索技能">
              </label>
              <button class="button primary" data-action="add-skill">${icon('plus', 'icon-14')}添加</button>
            </div>
          </div>
          <div class="skill-list" aria-label="Skill 列表">
            ${visible.length ? visible.map(skillCard).join('') : `<div class="empty"><strong>没有匹配的 Skill</strong>换一个名称或来源试试</div>`}
          </div>
        </section>`
    }

    function skillCard(skill) {
      const status = skill.status === 'problem'
        ? '<span class="skill-state problem">加载失败</span>'
        : (!skill.enabled ? '<span class="skill-state">已停用</span>' : '')
      return `
        <article class="skill-card ${skill.enabled ? '' : 'disabled'}">
          <button class="skill-main" data-skill-id="${escapeHtml(skill.id)}" aria-label="查看 ${escapeHtml(skill.name)}">
            <span class="skill-glyph">${icon('skill', 'icon-18')}</span>
            <span class="skill-copy">
              <span class="skill-title-line"><span class="skill-name">${escapeHtml(skill.name)}</span>${status}</span>
              <span class="skill-description">${escapeHtml(skill.description)}</span>
              <span class="skill-source">${escapeHtml(skill.sourceLabel)}</span>
            </span>
          </button>
          <span class="switch-cell">
            <button class="switch" type="button" role="switch" aria-checked="${skill.enabled}" aria-label="${skill.enabled ? '停用' : '启用'} ${escapeHtml(skill.name)}" data-toggle-skill="${escapeHtml(skill.id)}"></button>
          </span>
        </article>`
    }

    function renderSkillDetail(id) {
      const skill = skills.find(item => item.id === id)
      if (!skill) { navigate('settings/skills'); return }
      const statusText = skill.status === 'problem' ? '加载失败 · SKILL.md 缺少 description' : (skill.enabled ? '正常生效' : '已停用')
      const provider = skill.sourceType === 'plugin'
        ? `<button class="link-button" data-action="view-provider" data-provider="${escapeHtml(skill.provider)}">${escapeHtml(skill.sourceLabel)} ›</button>`
        : escapeHtml(skill.sourceLabel)
      content.innerHTML = `
        <section class="page" aria-labelledby="detailTitle">
          <button class="back" data-action="back-skills">${icon('arrow-left', 'icon-14')}Skills</button>
          <div class="detail-head">
            <span class="detail-icon">${icon('skill', 'icon-18')}</span>
            <div class="detail-title"><h1 id="detailTitle">${escapeHtml(skill.name)}</h1><p>${escapeHtml(skill.description)}</p></div>
            <div class="detail-actions">
              <button class="switch" type="button" role="switch" aria-checked="${skill.enabled}" aria-label="${skill.enabled ? '停用' : '启用'} ${escapeHtml(skill.name)}" data-toggle-skill="${escapeHtml(skill.id)}"></button>
              <button class="icon-button" data-action="toggle-menu" aria-label="更多操作" aria-expanded="${menuOpen}">${icon('more')}</button>
              ${menuOpen ? detailMenu(skill) : ''}
            </div>
          </div>
          <dl class="facts">
            <div class="fact"><dt>来源</dt><dd>${provider}</dd></div>
            <div class="fact"><dt>位置</dt><dd><code>${escapeHtml(skill.path)}</code></dd></div>
            <div class="fact"><dt>状态</dt><dd>${escapeHtml(statusText)}</dd></div>
          </dl>
          <section class="detail-section">
            <div class="section-heading"><h2>Instructions</h2></div>
            <div class="instruction"><h3>${escapeHtml(skill.name)}</h3><p>${escapeHtml(skill.instructions)}</p><p>只有在任务与此能力明确相关时才加载完整说明。</p></div>
          </section>
          <section class="detail-section">
            <div class="section-heading"><h2>资源文件</h2><span class="skill-source">${skill.files.length}</span></div>
            <button class="resource-row" data-action="show-files">${icon('file', 'icon-14')}<span>${escapeHtml(skill.files.join(' · '))}</span>${icon('chevron', 'icon-14')}</button>
          </section>
        </section>`
    }

    function detailMenu(skill) {
      const common = `<button class="menu-item" data-action="open-location">${icon('folder', 'icon-14')}打开所在位置</button>`
      if (skill.sourceType === 'plugin') return `<div class="context-menu" role="menu"><button class="menu-item" data-action="view-provider" data-provider="${escapeHtml(skill.provider)}">${icon('package', 'icon-14')}查看提供插件</button><button class="menu-item" data-action="copy-personal">${icon('plus', 'icon-14')}复制到个人目录</button></div>`
      if (skill.sourceType === 'bundled') return `<div class="context-menu" role="menu">${common}<button class="menu-item" data-action="copy-personal">${icon('plus', 'icon-14')}复制到个人目录</button></div>`
      if (skill.sourceType === 'git') return `<div class="context-menu" role="menu">${common}<button class="menu-item" data-action="check-update">${icon('refresh', 'icon-14')}检查更新</button><div class="menu-separator"></div><button class="menu-item danger" data-action="remove-skill" data-mode="uninstall">${icon('trash', 'icon-14')}卸载</button></div>`
      if (skill.sourceType === 'linked') return `<div class="context-menu" role="menu">${common}<div class="menu-separator"></div><button class="menu-item danger" data-action="remove-skill" data-mode="unlink">${icon('link', 'icon-14')}解除链接</button></div>`
      return `<div class="context-menu" role="menu">${common}<button class="menu-item" data-action="edit-skill">${icon('file', 'icon-14')}编辑 SKILL.md</button><div class="menu-separator"></div><button class="menu-item danger" data-action="remove-skill" data-mode="delete">${icon('trash', 'icon-14')}永久删除</button></div>`
    }

    function renderPlugins(providerId) {
      const providers = [
        { id: 'browser-tools', name: 'browser-tools', description: '提供浏览器控制、页面检查和录制能力。', contribution: '3 Skills · 6 Tools' },
        { id: 'deepcreator-skills', name: 'deepcreator-skills', description: 'DeepCreator 随产品提供的不可变开发技能。', contribution: '11 Skills' },
      ]
      content.innerHTML = `
        <section class="page" aria-labelledby="pluginsTitle">
          <div class="page-heading"><div class="page-heading-copy"><h1 id="pluginsTitle">插件</h1><p>安装、配置和管理 DSH 扩展。</p></div></div>
          ${providers.map(provider => `<article class="plugin-card ${provider.id === providerId ? 'highlight' : ''}"><strong>${escapeHtml(provider.name)}</strong><p>${escapeHtml(provider.description)}</p><div class="plugin-meta"><span>${escapeHtml(provider.contribution)}</span><span>已启用</span></div></article>`).join('')}
        </section>`
    }

    function renderPlaceholder(section) {
      const labels = { general: ['通用', '管理 DeepCreator 的基础行为。'], appearance: ['外观', '调整主题、字体与代码外观。'], models: ['模型', '配置可用模型和默认路由。'] }
      const [title, description] = labels[section] || labels.general
      content.innerHTML = `
        <section class="page"><div class="page-heading"><div class="page-heading-copy"><h1>${title}</h1><p>${description}</p></div></div>
          <div class="placeholder-card"><strong>${section === 'appearance' ? '界面外观' : section === 'models' ? '默认模型' : '偏好'}</strong><p>此区域用于展示设置导航的真实切换关系，当前原型重点是 Skill 页面。</p></div>
        </section>`
    }

    function toggleSkill(id) {
      const skill = skills.find(item => item.id === id)
      if (!skill) return
      skill.enabled = !skill.enabled
      if (skill.status !== 'problem') skill.status = skill.enabled ? 'active' : 'disabled'
      showToast(`${skill.name} 已${skill.enabled ? '启用' : '停用'}`)
      render()
    }

    function openAddModal() {
      modalRoot.innerHTML = `
        <div class="modal-overlay" data-modal-layer>
          <section class="modal" role="dialog" aria-modal="true" aria-labelledby="addTitle">
            <header class="modal-header"><div><h2 id="addTitle">添加 Skill</h2><p>选择一种来源</p></div><button class="icon-button" data-modal-close aria-label="关闭">${icon('close', 'icon-14')}</button></header>
            <div class="modal-body"><div class="choice-list">
              <button class="choice" data-add-type="local"><span class="choice-icon">${icon('folder')}</span><span><strong>从本地导入</strong><small>选择 Skill 文件夹或 SKILL.md</small></span>${icon('chevron', 'icon-14')}</button>
              <button class="choice" data-add-type="git"><span class="choice-icon">${icon('git')}</span><span><strong>从 Git / URL 安装</strong><small>安装可更新的受管理副本</small></span>${icon('chevron', 'icon-14')}</button>
              <button class="choice" data-add-type="link"><span class="choice-icon">${icon('link')}</span><span><strong>链接现有目录</strong><small>保留原目录，不复制内容</small></span>${icon('chevron', 'icon-14')}</button>
            </div></div>
          </section>
        </div>`
    }

    function renderAddStep(type) {
      const copy = {
        git: ['从 Git / URL 安装', 'GitHub、Git URL 或归档地址', 'https://github.com/example/my-skill', '安装'],
        link: ['链接现有目录', '本地 Skill 目录', '~/Documents/skills/my-skill', '添加链接'],
      }[type]
      if (type === 'local') {
        modalRoot.innerHTML = `
          <div class="modal-overlay" data-modal-layer><section class="modal" role="dialog" aria-modal="true" aria-labelledby="localTitle">
            <header class="modal-header"><div><h2 id="localTitle">从本地导入</h2><p>原始文件不会被修改</p></div><button class="icon-button" data-modal-close aria-label="关闭">${icon('close', 'icon-14')}</button></header>
            <div class="modal-body"><label class="drop-zone" for="localFile">${icon('folder', 'icon-18')}<span><strong id="localFileLabel">选择 Skill 文件夹或 SKILL.md</strong><small>也可以把文件拖到这里</small></span></label><input id="localFile" type="file" accept=".md" hidden></div>
            <footer class="modal-footer"><button class="button" data-action="back-add">返回</button><button class="button primary" data-install-type="local" disabled>导入</button></footer>
          </section></div>`
        return
      }
      modalRoot.innerHTML = `
        <div class="modal-overlay" data-modal-layer><section class="modal" role="dialog" aria-modal="true" aria-labelledby="sourceTitle">
          <header class="modal-header"><div><h2 id="sourceTitle">${copy[0]}</h2><p>${copy[1]}</p></div><button class="icon-button" data-modal-close aria-label="关闭">${icon('close', 'icon-14')}</button></header>
          <div class="modal-body"><label class="field-label" for="sourceValue">来源</label><input class="field" id="sourceValue" placeholder="${copy[2]}" autofocus><div class="scope" aria-label="安装范围"><button class="active" data-scope="personal">个人</button><button data-scope="project">当前项目</button></div></div>
          <footer class="modal-footer"><button class="button" data-action="back-add">返回</button><button class="button primary" data-install-type="${type}">${copy[3]}</button></footer>
        </section></div>`
      setTimeout(() => document.querySelector('#sourceValue')?.focus(), 0)
    }

    function deriveName(value) {
      const tail = value.trim().replace(/[\\/]+$/, '').split(/[\\/]/).pop() || 'new-skill'
      return tail.replace(/\.git$/i, '').replace(/\.md$/i, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'new-skill'
    }

    function installSkill(type) {
      let source = ''
      if (type === 'local') {
        source = document.querySelector('#localFile')?.files?.[0]?.name || ''
        if (!source) return
      } else {
        source = document.querySelector('#sourceValue')?.value.trim() || ''
        if (!source) { document.querySelector('#sourceValue')?.focus(); return }
      }
      const name = deriveName(source)
      const existing = skills.find(skill => skill.name === name)
      if (existing) {
        modalRoot.innerHTML = ''
        navigate(`settings/skills/${existing.id}`)
        showToast(`${name} 已经存在`)
        return
      }
      const sourceType = type === 'git' ? 'git' : type === 'link' ? 'linked' : addScope === 'project' ? 'project' : 'personal'
      const sourceLabel = type === 'git' ? 'Git 安装' : type === 'link' ? '外部链接' : addScope === 'project' ? '当前项目' : '个人'
      const path = type === 'link' ? source : addScope === 'project' ? `.agents/skills/${name}` : `~/.agents/skills/${name}`
      skills.push({ id: name, name, description: '刚刚添加的 Skill。', sourceType, sourceLabel, enabled: true, provider: type === 'git' ? source : 'filesystem', path, status: 'active', instructions: '这是原型中刚刚添加的 Skill。正式产品会读取 SKILL.md，并在这里展示真实说明。', files: ['SKILL.md'] })
      modalRoot.innerHTML = ''
      navigate(`settings/skills/${name}`)
      showToast(`已添加 ${name}`)
    }

    function openRemoveConfirm(skill, mode) {
      const copy = {
        delete: ['永久删除 Skill？', '将删除这个可写 Skill 目录及其资源。', '永久删除'],
        uninstall: ['卸载 Skill？', '将移除受管理的安装副本，可从原来源重新安装。', '卸载'],
        unlink: ['解除 Skill 链接？', '只移除 DeepCreator 中的链接，不删除外部原目录。', '解除链接'],
      }[mode]
      modalRoot.innerHTML = `
        <div class="modal-overlay" data-modal-layer><section class="modal" role="dialog" aria-modal="true" aria-labelledby="removeTitle">
          <header class="modal-header"><div><h2 id="removeTitle">${copy[0]}</h2><p>${escapeHtml(skill.name)}</p></div><button class="icon-button" data-modal-close aria-label="关闭">${icon('close', 'icon-14')}</button></header>
          <div class="modal-body"><p style="margin:0;color:var(--text-2);font-size:12px">${copy[1]}</p><div class="confirm-path">${escapeHtml(skill.path)}</div></div>
          <footer class="modal-footer"><button class="button" data-modal-close>取消</button><button class="button danger" data-confirm-remove="${escapeHtml(skill.id)}" data-mode="${mode}">${copy[2]}</button></footer>
        </section></div>`
    }

    function removeSkill(id, mode) {
      const index = skills.findIndex(skill => skill.id === id)
      if (index === -1) return
      const [skill] = skills.splice(index, 1)
      modalRoot.innerHTML = ''
      navigate('settings/skills')
      showToast(mode === 'unlink' ? `已解除 ${skill.name} 的链接` : mode === 'uninstall' ? `已卸载 ${skill.name}` : `已删除 ${skill.name}`)
    }

    nav.addEventListener('click', event => {
      const button = event.target.closest('[data-section]')
      if (button) navigate(`settings/${button.dataset.section}`)
    })

    content.addEventListener('input', event => {
      if (event.target.id !== 'skillSearch') return
      searchQuery = event.target.value
      renderSkillList()
      const input = document.querySelector('#skillSearch')
      input?.focus()
      input?.setSelectionRange(searchQuery.length, searchQuery.length)
    })

    content.addEventListener('click', event => {
      const toggle = event.target.closest('[data-toggle-skill]')
      if (toggle) { toggleSkill(toggle.dataset.toggleSkill); return }
      const card = event.target.closest('[data-skill-id]')
      if (card) { navigate(`settings/skills/${card.dataset.skillId}`); return }
      const action = event.target.closest('[data-action]')
      if (!action) return
      const route = parseRoute()
      const skill = skills.find(item => item.id === route.id)
      switch (action.dataset.action) {
        case 'add-skill': openAddModal(); break
        case 'back-skills': navigate('settings/skills'); break
        case 'toggle-menu': menuOpen = !menuOpen; renderSkillDetail(route.id); break
        case 'view-provider': navigate(`settings/plugins/${action.dataset.provider}`); break
        case 'open-location': menuOpen = false; renderSkillDetail(route.id); showToast(`将在文件管理器中打开 ${skill.path}`); break
        case 'edit-skill': menuOpen = false; renderSkillDetail(route.id); showToast('将在默认编辑器中打开 SKILL.md'); break
        case 'check-update': menuOpen = false; renderSkillDetail(route.id); showToast(`${skill.name} 已是最新版本`); break
        case 'copy-personal': {
          const copyName = `${skill.name}-personal`
          if (!skills.some(item => item.id === copyName)) skills.push({ ...skill, id: copyName, name: copyName, sourceType: 'personal', sourceLabel: '个人', provider: 'filesystem', path: `~/.agents/skills/${copyName}`, files: [...skill.files] })
          navigate(`settings/skills/${copyName}`)
          showToast(`已复制到个人目录`)
          break
        }
        case 'remove-skill': openRemoveConfirm(skill, action.dataset.mode); break
        case 'show-files': showToast(skill.files.join(' · ')); break
      }
    })

    modalRoot.addEventListener('click', event => {
      if (event.target.matches('[data-modal-layer]') || event.target.closest('[data-modal-close]')) { modalRoot.innerHTML = ''; return }
      const choice = event.target.closest('[data-add-type]')
      if (choice) { renderAddStep(choice.dataset.addType); return }
      const back = event.target.closest('[data-action="back-add"]')
      if (back) { openAddModal(); return }
      const scope = event.target.closest('[data-scope]')
      if (scope) {
        addScope = scope.dataset.scope
        modalRoot.querySelectorAll('[data-scope]').forEach(button => button.classList.toggle('active', button === scope))
        return
      }
      const install = event.target.closest('[data-install-type]')
      if (install) { installSkill(install.dataset.installType); return }
      const remove = event.target.closest('[data-confirm-remove]')
      if (remove) removeSkill(remove.dataset.confirmRemove, remove.dataset.mode)
    })

    modalRoot.addEventListener('change', event => {
      if (event.target.id !== 'localFile') return
      const file = event.target.files?.[0]
      document.querySelector('#localFileLabel').textContent = file ? file.name : '选择 Skill 文件夹或 SKILL.md'
      const install = document.querySelector('[data-install-type="local"]')
      if (install) install.disabled = !file
    })

    document.querySelector('#skillsShortcut').addEventListener('click', () => navigate('settings/skills'))
    document.querySelector('#settingsShortcut').addEventListener('click', () => navigate('settings/general'))
    document.querySelector('#settingsClose').addEventListener('click', () => navigate('home'))
    document.querySelector('#settingsMask').addEventListener('click', () => navigate('home'))
    window.addEventListener('hashchange', render)
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return
      if (modalRoot.innerHTML) modalRoot.innerHTML = ''
      else if (parseRoute().open) navigate('home')
    })

    if (!location.hash) location.hash = '#settings/skills'
    else render()
  </script>
</body>
</html>
