packages:
  - 'apps/*'
  - 'packages/*/*'
  # Static-analysis faces intentionally share official package names so the
  # Typert compiler can resolve canonical symbols. They are never installable
  # workspace packages and must not participate in pnpm runtime linking.
  - '!packages/internal/*'

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  electron: true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true

patchedDependencies:
  '@deepseek-ai/dsh-tool-fs@0.1.0-rc.7': patches/@deepseek-ai__dsh-tool-fs@0.1.0-rc.7.patch
  '@deepseek-ai/dsh-tools@0.1.0-rc.7': patches/@deepseek-ai__dsh-tools@0.1.0-rc.7.patch
